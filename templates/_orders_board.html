{% for col in columns %}
<div class="board-col">
  <div class="board-col-head">
    <span class="dot" style="background: var(--status-{{ col.status }})"></span>
    {{ col.label }}
    <span class="count">{{ col.orders|length }}</span>
  </div>
  <div class="board-col-body">
    {% for o in col.orders %}
    <div class="order-card">
      <div class="order-tariff">{{ o['tariff'] }}</div>
      <div class="order-meta">Лид #{{ o['lead_id'] }} · {{ o['department'] }}</div>
      <div class="order-price">{{ o['price_label'] }}</div>
      {% if col.status != 'зачислен' %}
      <form hx-post="/orders/{{ o['id'] }}/advance" hx-target="#board" hx-swap="innerHTML">
        <button type="submit">Сдвинуть статус →</button>
      </form>
      {% endif %}
    </div>
    {% else %}
    <div class="empty-state">Пусто</div>
    {% endfor %}
  </div>
</div>
{% endfor %}
